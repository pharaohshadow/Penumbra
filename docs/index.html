<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Penumbra</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet" />
</head>
<body>
  <!-- Layout a 3 colonne su PC: solo il centro è il gioco -->
  <div class="page-shell">
    <aside class="side-panel side-left" aria-hidden="true"></aside>

    <div id="app" class="game-column">
      <!-- Header -->
      <header class="top-bar">
        <div class="logo">PENUMBRA</div>
        <div class="turn-info">
          <span id="turn-label">Turno 1</span>
          <span class="separator">•</span>
          <span id="phase-label">Tuo turno</span>
        </div>
        <div class="powa-display">
          <span class="powa-icon">◆</span>
          <span id="powa-value">1</span>
          <span class="powa-max">/ 6</span>
        </div>
      </header>

      <!-- Arena -->
      <main class="arena">
        <div class="player-panel ai-panel">
          <div class="avatar ai-avatar">𓀀</div>
          <div class="info">
            <div class="name">Faraone Oscuro</div>
            <div class="hp-bar">
              <div class="hp-fill" id="ai-hp-fill" style="width:100%"></div>
              <span class="hp-text" id="ai-hp-text">20 / 20</span>
            </div>
          </div>
        </div>

        <div class="grid-wrapper">
          <div id="grid" class="grid"></div>
        </div>

        <div class="player-panel human-panel">
          <div class="avatar human-avatar">𓁹</div>
          <div class="info">
            <div class="name">Tu</div>
            <div class="hp-bar">
              <div class="hp-fill player" id="player-hp-fill" style="width:100%"></div>
              <span class="hp-text" id="player-hp-text">20 / 20</span>
            </div>
          </div>
        </div>
      </main>

      <!-- Mano -->
      <section class="hand-section">
        <div id="hand" class="hand"></div>
      </section>

      <!-- Azioni -->
      <footer class="bottom-bar">
        <button id="btn-end-turn" class="btn primary">Fine Turno</button>
        <div class="trap-badge" id="trap-badge" title="Trappole posate">🪤 <span id="trap-count">0</span></div>
        <div class="hint" id="hint">Clicca una carta o un'unità</div>
      </footer>

      <!-- Overlay -->
      <div id="message-overlay" class="overlay hidden">
        <div class="message-box">
          <p id="message-text"></p>
          <button id="btn-close-message" class="btn">OK</button>
          <button id="btn-restart" class="btn primary hidden">Rigioca</button>
        </div>
      </div>
    </div>

    <aside class="side-panel side-right" aria-hidden="true"></aside>
  </div>

  <script src="js/cards.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
