<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
<title>Penumbra</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #0b0d12; --panel: #141820; --text: #e5e7eb; --muted: #9ca3af;
    --accent: #818cf8; --p0: #4ade80; --p1: #f87171; --border: #2a2f3a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; }
  .app-shell { display: flex; justify-content: center; min-height: 100vh; padding: 8px; }
  .app-col { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 8px; }
  @media (orientation: landscape) and (min-width: 900px) {
    .app-shell { display: grid; grid-template-columns: 1fr minmax(320px, 440px) 1fr; }
    .app-col { grid-column: 2; }
  }
  header { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  header h1 { font-size: 1.1rem; margin: 0; color: var(--accent); }
  .btn { background: #312e81; color: #fff; border: 0; border-radius: 8px; padding: 8px 12px; cursor: pointer; font-size: 0.85rem; }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .btn.secondary { background: #1f2937; }
  .mode-grid { display: grid; gap: 10px; margin-top: 12px; }
  .mode-btn { text-align: left; padding: 14px 16px; font-size: 0.95rem; width: 100%; background: #1a1f2a; color: var(--text); border: 1px solid var(--border); border-radius: 10px; cursor: pointer; }
  .mode-btn .sub { display: block; font-size: 0.78rem; font-weight: 400; color: var(--muted); margin-top: 4px; }
  .mode-btn:disabled { opacity: 0.45; cursor: default; }
  .mode-btn.active-mode { border-color: var(--accent); }

  #loginBox, #homeBox { background: var(--panel); border-radius: 12px; padding: 16px; border: 1px solid var(--border); }
  #loginBox input { width: 100%; padding: 8px; margin: 6px 0; border-radius: 6px; border: 1px solid var(--border); background: #0f1218; color: var(--text); }
  #hexBoard {
    position: relative; width: 100%; height: min(70vw, 420px); min-height: 320px;
    background: #1a2a1f; border-radius: 12px; border: 1px solid var(--border);
    overflow: hidden;
  }
  .hex {
    position: absolute; width: 56px; height: 48px; margin-left: -28px; margin-top: -24px;
    /* flat-top (come hex_to_pixel del backend e l'editor) */
    clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
    background: #3d5c45;
    border: none; display: flex; flex-direction: column;
    align-items: center; justify-content: center; font-size: 0.52rem; cursor: pointer;
    color: #d8e8d4; text-align: center; line-height: 1.1; padding: 3px;
    box-shadow: inset 0 0 0 1px #5a7a62;
  }
  .hex.altar { background: #c9a227; color: #1a1400; font-weight: 700; box-shadow: inset 0 0 0 2px #e8c84a; }
  /* Bordo esterno = lava (non calpestabile) */
  .hex.frame {
    background: linear-gradient(160deg, #ff6b2d 0%, #c43c12 40%, #6b1a08 100%);
    color: #ffe8c8; cursor: default;
    box-shadow: inset 0 0 8px rgba(255, 120, 40, 0.55), inset 0 0 0 1px #ff9a4a;
    font-weight: 700;
  }
  .hex.frame .fname { font-size: 0.65rem; opacity: 1; }
  .hex.temple { background: #e879a9; color: #2a0a18; box-shadow: inset 0 0 0 2px #f9a8d4; font-weight: 700; }
  .hex.selected { outline: 2px solid #fbbf24; z-index: 5; }
  /* Fog: più scuro, diverso da lava e terreno */
  .hex.fog { background: #1a221c; color: #3a4a40; opacity: 0.9; box-shadow: inset 0 0 0 1px #243028; }
  .hex.artifact::after { content: "◆"; color: #fbbf24; position: absolute; top: 6px; font-size: 0.7rem; }
  .hex .fname { font-size: 0.5rem; opacity: 0.9; max-width: 50px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .unit { font-weight: 700; font-size: 0.62rem; line-height: 1.1; border-radius: 3px; padding: 1px 2px; }
  .unit.p0 { color: var(--p0); }
  .unit.p1 { color: var(--p1); }
  .unit.neutral { color: #d1d5db; }
  .unit.signore { color: #f472b6; }
  .unit.ready { box-shadow: 0 0 0 2px #4ade80, 0 0 8px rgba(74,222,128,0.5); animation: pulse 1.4s infinite; }
  .unit.withered { box-shadow: 0 0 0 2px #6b7280; opacity: 0.7; filter: grayscale(0.3); }
  @keyframes pulse {
    0%,100% { box-shadow: 0 0 0 2px #4ade80, 0 0 6px rgba(74,222,128,0.35); }
    50% { box-shadow: 0 0 0 2px #86efac, 0 0 12px rgba(74,222,128,0.7); }
  }
  .player-panel {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 10px 12px; display: flex; flex-direction: column; gap: 6px;
  }
  .player-panel .name { font-weight: 700; font-size: 1rem; }
  .player-panel .medallion {
    background: #0f1218; border: 1px dashed #fbbf24; border-radius: 8px;
    padding: 6px 8px; font-size: 0.78rem; color: #fbbf24;
  }
  .player-panel .medallion .eff { color: var(--muted); font-size: 0.72rem; }
  .stats-row { display: flex; flex-wrap: wrap; gap: 8px; font-size: 0.8rem; color: var(--muted); }
  .stats-row strong { color: var(--text); }
  #hand { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0; min-height: 72px; }
  .card {
    flex: 0 0 auto; width: 88px; background: #1a1f2a; border: 1px solid var(--border);
    border-radius: 8px; padding: 6px; font-size: 0.7rem; cursor: pointer;
  }
  .card.selected { border-color: #fbbf24; }
  .card .cname { font-weight: 700; }
  .card .ccost { color: var(--accent); }
  #log {
    background: #0f1218; border-radius: 8px; padding: 8px; font-size: 0.72rem;
    color: var(--muted); max-height: 100px; overflow-y: auto; white-space: pre-wrap;
  }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  #cluePopup { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.65); z-index: 100; align-items: center; justify-content: center; }
  #cluePopup.show { display: flex; }
  #cluePopup .box { background: #1a1d24; border: 1px solid #fbbf24; border-radius: 12px; padding: 24px; max-width: 320px; text-align: center; }
  #draftBox { background: var(--panel); border-radius: 12px; padding: 12px; border: 1px solid var(--border); }
  .draft-card { display: inline-block; margin: 4px; padding: 8px; background: #1a1f2a; border-radius: 8px; cursor: pointer; font-size: 0.75rem; border: 1px solid var(--border); }
  .draft-card:hover { border-color: var(--accent); }
  #eldraziBox { display: none; background: #1a1020; border: 1px solid #a78bfa; border-radius: 8px; padding: 8px; font-size: 0.75rem; }
  #eldraziBox.show { display: block; }
</style>
</head>
<body>
<div class="app-shell"><div class="app-col">
  <div id="cluePopup"><div class="box"><h2>Indizio</h2><p id="cluePopupText">GGWP</p><button class="btn" id="cluePopupOk">OK</button></div></div>

  <div id="loginBox">
    <h1>Penumbra</h1>
    <p style="color:var(--muted);font-size:0.85rem">Accedi per giocare</p>
    <input id="email" type="email" placeholder="Email"/>
    <input id="password" type="password" placeholder="Password"/>
    <button class="btn" id="btnLogin">Login</button>
    <button class="btn secondary" id="btnRegister">Registrati</button>
    <p id="loginErr" style="color:#f87171;font-size:0.8rem"></p>
  </div>

    <div id="homeBox" style="display:none">
    <header><h1>Penumbra</h1><button class="btn secondary" id="btnLogout">Esci</button></header>
    <p id="homeUser" style="color:var(--muted);font-size:0.85rem"></p>
    <div class="mode-grid">
      <button class="mode-btn active-mode" id="modeBase">
        Partita base
        <span class="sub">Draft + mappa esagonale vs IA</span>
      </button>
      <button class="mode-btn" id="modeTutorial" disabled>
        Tutorial
        <span class="sub">In arrivo</span>
      </button>
      <button class="mode-btn" id="modePvp" disabled>
        PvP
        <span class="sub">In arrivo</span>
      </button>
      <button class="mode-btn" id="modeStoria" disabled>
        Storia
        <span class="sub">In arrivo</span>
      </button>
      <button class="mode-btn" id="modeEndless" disabled>
        Endless
        <span class="sub">In arrivo</span>
      </button>
    </div>
    <p id="homeMsg" style="color:var(--muted);font-size:0.8rem;margin-top:10px"></p>
  </div>

<div id="gameRoot" style="display:none">
    <header>
      <h1>Penumbra</h1>
      <span id="turnInfo" style="font-size:0.8rem;color:var(--muted)"></span>
    </header>
    <div id="draftBox" style="display:none"></div>
    <div id="hexBoard"></div>
    <div id="eldraziBox"><strong>Mostrissimi (Cerchio Rituale)</strong><div id="eldraziList"></div></div>
    <div class="player-panel" id="playerPanel">
      <div class="name" id="pName">—</div>
      <div class="medallion">
        <div id="medName">Medaglione random</div>
        <div class="eff" id="medEff">Effetto del medaglione</div>
      </div>
      <div class="stats-row" id="pStats"></div>
      <div id="hand"></div>
    </div>
    <div class="actions">
      <button class="btn" id="btnEnd">Fine turno</button>
      <button class="btn secondary" id="btnHome">Menu</button>
    </div>
    <div id="log"></div>
  </div>
</div></div>

<script>
// ========== Supabase (progetto Penumbra) ==========
const SUPABASE_URL = "https://favrmxwyaxklfiruyvqz.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZhdnJteHd5YXhrbGZpcnV5dnF6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI4MTA4OTYsImV4cCI6MjEwODM4Njg5Nn0.HLR7eYKscg6ldoYkuFpRx9LMWzSGeSCZ1Jl0Rgu9N-0";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
// =================================================

const API = "";
let token = null;
let gameId = localStorage.getItem("penumbra_game_id") || null;
let playerId = parseInt(localStorage.getItem("penumbra_player_id") || "0", 10);
let state = null;
let selectedCoord = null;
let selectedHand = null;

async function api(path, body) {
  if (!token) throw new Error("Devi essere loggato");
  const opts = {
    method: body !== undefined && body !== null ? "POST" : "GET",
    headers: { "Authorization": "Bearer " + token },
  };
  if (body !== undefined && body !== null) {
    opts.headers["Content-Type"] = "application/json";
    opts.body = JSON.stringify(body);
  }
  const res = await fetch(API + path, opts);
  const text = await res.text();
  let data;
  try { data = text ? JSON.parse(text) : {}; } catch { data = { detail: text }; }
  if (!res.ok) {
    const msg = data.detail || data.message || text || res.status;
    throw new Error(typeof msg === "string" ? msg : JSON.stringify(msg));
  }
  return data;
}

function showLogin() {
  document.getElementById("loginBox").style.display = "block";
  document.getElementById("homeBox").style.display = "none";
  document.getElementById("gameRoot").style.display = "none";
}
function showHome(email) {
  document.getElementById("loginBox").style.display = "none";
  document.getElementById("homeBox").style.display = "block";
  document.getElementById("gameRoot").style.display = "none";
  const hu = document.getElementById("homeUser");
  if (hu) hu.textContent = email ? ("Loggato come " + email) : "";
}
function showGame() {
  document.getElementById("loginBox").style.display = "none";
  document.getElementById("homeBox").style.display = "none";
  document.getElementById("gameRoot").style.display = "block";
}

document.getElementById("btnLogin").onclick = async () => {
  const err = document.getElementById("loginErr");
  err.textContent = "Accesso…";
  try {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) { err.textContent = error.message; return; }
    token = data.session.access_token;
    err.textContent = "";
    showHome(data.user.email);
  } catch (e) {
    err.textContent = String(e.message || e);
  }
};

// Registrazione opzionale se c'è il bottone
const btnReg = document.getElementById("btnRegister");
if (btnReg) {
  btnReg.onclick = async () => {
    const err = document.getElementById("loginErr");
    err.textContent = "Registrazione…";
    try {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const { data, error } = await sb.auth.signUp({ email, password });
      if (error) { err.textContent = error.message; return; }
      if (data.session) {
        token = data.session.access_token;
        err.textContent = "";
        showHome(data.user.email);
      } else {
        err.textContent = "Controlla la email per confermare l'account, poi accedi.";
      }
    } catch (e) {
      err.textContent = String(e.message || e);
    }
  };
}

document.getElementById("btnLogout").onclick = async () => {
  await sb.auth.signOut();
  token = null;
  gameId = null;
  localStorage.removeItem("penumbra_game_id");
  showLogin();
};

const startBase = async () => {
  const hm = document.getElementById("homeMsg");
  if (hm) hm.textContent = "Creazione partita…";
  try {
    state = await api("/api/new", { mode: "base", vs_ai: true });
    gameId = state.game_id;
    playerId = 0;
    localStorage.setItem("penumbra_game_id", gameId);
    localStorage.setItem("penumbra_player_id", "0");
    if (hm) hm.textContent = "";
    showGame();
    render();
  } catch (e) {
    if (hm) hm.textContent = String(e.message || e);
    alert(e.message);
  }
};
document.getElementById("modeBase").onclick = startBase;
// legacy alias
document.getElementById("btnNew") && (document.getElementById("btnNew").onclick = startBase);

document.getElementById("btnHome").onclick = () => showHome();
document.getElementById("cluePopupOk").onclick = () => {
  document.getElementById("cluePopup").classList.remove("show");
};

document.getElementById("btnEnd").onclick = async () => {
  try {
    state = await api("/api/end", { game_id: gameId, player_id: playerId });
    selectedCoord = null;
    render();
  } catch (e) { alert(e.message); }
};

function onHexClick(coord) {
  if (!state || state.phase === "DRAFT") return;
  if (selectedHand != null) {
    playSelected(coord);
    return;
  }
  if (selectedCoord === coord) { selectedCoord = null; render(); return; }
  if (selectedCoord) {
    moveTo(coord);
  } else {
    selectedCoord = coord;
    render();
  }
}

async function moveTo(coord) {
  try {
    state = await api("/api/move", {
      game_id: gameId, player_id: playerId,
      from_coord: selectedCoord, to_coord: coord
    });
    selectedCoord = null;
    render();
  } catch (e) {
    alert(e.message);
    selectedCoord = null;
    render();
  }
}

async function playSelected(coord) {
  try {
    state = await api("/api/play", {
      game_id: gameId, player_id: playerId,
      hand_index: selectedHand, target_coord: coord
    });
    selectedHand = null;
    selectedCoord = null;
    render();
  } catch (e) {
    alert(e.message);
  }
}

function render() {
  if (!state) return;
  document.getElementById("turnInfo").textContent =
    `Turno ${state.turn} · ${state.phase} · P${state.current_player}`;

  const db = document.getElementById("draftBox");
  if (state.phase === "DRAFT" && state.draft) {
    db.style.display = "block";
    const packs = Array.isArray(state.draft.packs) ? state.draft.packs : [];
    let html = "<strong>Draft – scegli una busta</strong><br/>";
    packs.forEach((pk, i) => {
      html += `<div class="draft-card" data-i="${i}">${pk.label || pk.color || ("Busta "+i)}</div>`;
    });
    db.innerHTML = html;
    db.querySelectorAll(".draft-card").forEach(el => {
      el.onclick = async () => {
        try {
          state = await api("/api/draft", {
            game_id: gameId, player_id: playerId,
            pack_index: +el.dataset.i, card_index: +el.dataset.i
          });
          render();
        } catch (e) { alert(e.message); }
      };
    });
  } else {
    db.style.display = "none";
  }

  const boardEl = document.getElementById("hexBoard");
  boardEl.innerHTML = "";
  // SVG per i muri (sopra gli hex, pointer-events none)
  let wallSvg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  wallSvg.setAttribute("style", "position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4");
  wallSvg.setAttribute("width", "100%");
  wallSvg.setAttribute("height", "100%");

  const cells = state.board || [];
  if (!cells.length) return;

  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  cells.forEach(c => {
    if (c.x == null || c.y == null) return;
    minX = Math.min(minX, c.x); maxX = Math.max(maxX, c.x);
    minY = Math.min(minY, c.y); maxY = Math.max(maxY, c.y);
  });
  const bw = boardEl.clientWidth || 400;
  const bh = boardEl.clientHeight || 360;
  const pad = 28;
  const dx = Math.max(1, maxX - minX);
  const dy = Math.max(1, maxY - minY);
  // scala per far entrare TUTTI gli esagoni nel riquadro
  const scale = Math.min((bw - pad * 2) / dx, (bh - pad * 2) / dy) * 0.92;
  const ox = (bw - dx * scale) / 2;
  const oy = (bh - dy * scale) / 2;
  const hs = Math.max(32, Math.min(56, scale * 1.18)); // leggermente sovrapposti → niente buchi neri

  cells.forEach(cell => {
    if (cell.x == null || cell.y == null) return;
    const div = document.createElement("div");
    let cls = "hex";
    if (cell.altar) cls += " altar";
    if (cell.tile && String(cell.tile).startsWith("Tempio")) cls += " temple";
    if (cell.tile === "Cornice") cls += " frame";
    if (cell.fog) cls += " fog";
    if (cell.artifact) cls += " artifact";
    if (selectedCoord === cell.coord) cls += " selected";
    div.className = cls;
    const x = ox + (cell.x - minX) * scale;
    const y = oy + (cell.y - minY) * scale;
    div.style.left = x + "px";
    div.style.top = y + "px";
    // flat-top: larghezza > altezza
    div.style.width = hs + "px";
    div.style.height = (hs * 0.866) + "px";
    div.style.marginLeft = (-hs / 2) + "px";
    div.style.marginTop = (-hs * 0.433) + "px";

    let html = "";
    if (cell.unit) {
      const u = cell.unit;
      let ucls = u.owner === 0 ? "p0" : u.owner === 1 ? "p1" : "neutral";
      if (u.signore) ucls += " signore";
      if (u.owner === playerId) ucls += u.withered ? " withered" : " ready";
      const hp = u.signore ? "∞" : u.hp;
      let uname = (u.name || "").replace(/\s*\d+\/\d+\s*$/, "").trim() || u.name;
      html += `<div class="unit ${ucls}">${u.crown ? "👑" : ""}${uname}<br/>${u.atk}/${hp}</div>`;
    } else if (!cell.fog) {
      let label;
      if (cell.altar) label = "Altare";
      else if (cell.tile && String(cell.tile).startsWith("Tempio")) label = cell.tile.replace("Tempio", "T");
      else if (cell.tile === "Cornice") label = "Lava";
      else label = cell.flavor || cell.coord || "";
      if (label) html += `<span class="fname">${label}</span>`;
    } else {
      html += `<span class="fname">░</span>`;
    }
    div.innerHTML = html;
    div.onclick = () => onHexClick(cell.coord);
    if (cell.tile === "Cornice" || cell.tile === "FRAME") {
      div.classList.add("frame");
      div.onclick = null;
    }
    boardEl.appendChild(div);
  });

  // Montagne irregolari sul bordo condiviso (poligoni SVG, non linee)
  function sharedEdgeEnds(c1x, c1y, c2x, c2y, R) {
    const mx = (c1x + c2x) / 2, my = (c1y + c2y) / 2;
    let dx = c2x - c1x, dy = c2y - c1y;
    const len = Math.hypot(dx, dy) || 1;
    dx /= len; dy /= len;
    const px = -dy, py = dx, half = R / 2;
    return {
      x1: mx + px * half, y1: my + py * half,
      x2: mx - px * half, y2: my - py * half,
      nx: px, ny: py, // normale (verso un lato del bordo)
      tx: dx, ty: dy  // tangente lungo il bordo
    };
  }
  // seed stabile da coordinate → ogni montagna diversa ma fissa
  function wallSeed(a, b) {
    const s = String(a) + "|" + String(b);
    let h = 0;
    for (let i = 0; i < s.length; i++) h = ((h << 5) - h + s.charCodeAt(i)) | 0;
    return Math.abs(h);
  }
  function mulberry32(a) {
    return function() {
      let t = a += 0x6D2B79F5;
      t = Math.imul(t ^ t >>> 15, t | 1);
      t ^= t + Math.imul(t ^ t >>> 7, t | 61);
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  const byQr = {};
  cells.forEach(c => { if (c.qr) byQr[c.qr] = c; });
  const walls = state.edge_walls || [];
  walls.forEach(w => {
    const ca = byQr[w.a_qr];
    const cb = byQr[w.b_qr];
    if (!ca || !cb) return;
    const cx1 = ox + (ca.x - minX) * scale;
    const cy1 = oy + (ca.y - minY) * scale;
    const cx2 = ox + (cb.x - minX) * scale;
    const cy2 = oy + (cb.y - minY) * scale;
    // R un po' più corto: la montagna resta SUL bordo, non entra nei centri
    const R = hs * 0.78;
    const e = sharedEdgeEnds(cx1, cy1, cx2, cy2, R);
    const len = Math.hypot(e.x2 - e.x1, e.y2 - e.y1) || 1;
    const rnd = mulberry32(wallSeed(w.a_qr, w.b_qr));
    const nPeaks = 3 + Math.floor(rnd() * 2);
    // spessore totale centrato sul bordo (più spesso, ma contenuto nel gap)
    const halfThick = hs * (0.11 + rnd() * 0.04);
    const ridgeExtra = hs * (0.04 + rnd() * 0.03); // piccoli picchi, non invadono l'esagono

    const topPts = [];
    for (let i = 0; i <= nPeaks + 1; i++) {
      const t = i / (nPeaks + 1);
      const bx = e.x1 + (e.x2 - e.x1) * t;
      const by = e.y1 + (e.y2 - e.y1) * t;
      let h = halfThick;
      if (i > 0 && i < nPeaks + 1) h += ridgeExtra * (0.5 + rnd() * 0.5);
      else h *= 0.7;
      const jitter = (rnd() - 0.5) * len * 0.03;
      topPts.push([bx + e.nx * h + e.tx * jitter, by + e.ny * h + e.ty * jitter]);
    }
    const botPts = [];
    for (let i = nPeaks + 1; i >= 0; i--) {
      const t = i / (nPeaks + 1);
      const bx = e.x1 + (e.x2 - e.x1) * t;
      const by = e.y1 + (e.y2 - e.y1) * t;
      let h = halfThick * (0.85 + rnd() * 0.2);
      if (i > 0 && i < nPeaks + 1) h += ridgeExtra * 0.35 * rnd();
      botPts.push([bx - e.nx * h, by - e.ny * h]);
    }

    const all = topPts.concat(botPts);
    const d = all.map((p, i) => (i === 0 ? "M" : "L") + p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ") + " Z";

    const shadow = document.createElementNS("http://www.w3.org/2000/svg", "path");
    shadow.setAttribute("d", d);
    shadow.setAttribute("fill", "#2a241f");
    shadow.setAttribute("opacity", "0.9");
    wallSvg.appendChild(shadow);

    const body = document.createElementNS("http://www.w3.org/2000/svg", "path");
    body.setAttribute("d", d);
    body.setAttribute("fill", "#7a6a55");
    body.setAttribute("stroke", "#4a3f35");
    body.setAttribute("stroke-width", "1.2");
    wallSvg.appendChild(body);

    if (topPts.length >= 2) {
      let ridgeD = "M" + topPts[0][0].toFixed(1) + "," + topPts[0][1].toFixed(1);
      for (let i = 1; i < topPts.length; i++) {
        ridgeD += " L" + topPts[i][0].toFixed(1) + "," + topPts[i][1].toFixed(1);
      }
      const ridge = document.createElementNS("http://www.w3.org/2000/svg", "path");
      ridge.setAttribute("d", ridgeD);
      ridge.setAttribute("fill", "none");
      ridge.setAttribute("stroke", "#d4c4a8");
      ridge.setAttribute("stroke-width", "2");
      ridge.setAttribute("stroke-linejoin", "round");
      ridge.setAttribute("stroke-linecap", "round");
      ridge.setAttribute("opacity", "0.95");
      wallSvg.appendChild(ridge);
    }
  });
  boardEl.appendChild(wallSvg);

  const p = (state.players || []).find(x => x.id === playerId) || (state.players || [])[0] || {};
  document.getElementById("pName").textContent = p.name || "Giocatore";
  const med = p.medallion || { name: "Medaglione random", effect: "Effetto del medaglione" };
  document.getElementById("medName").textContent = med.name;
  document.getElementById("medEff").textContent = med.effect;
  document.getElementById("pStats").innerHTML = `
    <span>Mana <strong>${p.mana ?? 0}/${p.mana_max ?? 0}</strong></span>
    <span>Frammenti <strong>${p.fragments ?? 0}</strong></span>
    <span>Corona <strong>${p.has_crown ? "sì" : "no"}</strong></span>
    <span>Indizi <strong>${p.clues ?? 0}</strong></span>`;

  const handEl = document.getElementById("hand");
  handEl.innerHTML = "";
  (p.hand || []).forEach((c, i) => {
    if (c.type === "Mostrissimo" || c.card_type === "Mostrissimo") return;
    const d = document.createElement("div");
    d.className = "card" + (selectedHand === i ? " selected" : "");
    d.innerHTML = `<div class="cname">${c.name}</div><div class="ccost">${c.cost} mana</div><div>${c.atk || 0}/${c.hp || 0}</div>`;
    d.onclick = () => { selectedHand = (selectedHand === i ? null : i); render(); };
    handEl.appendChild(d);
  });

  document.getElementById("eldraziBox").classList.remove("show");
  document.getElementById("log").textContent = (state.log || []).join("\\n");

  if (state.pending_popups && state.pending_popups.length) {
    const pop = state.pending_popups.find(x => x.type === "clue") || state.pending_popups[0];
    if (pop) {
      document.getElementById("cluePopupText").textContent = pop.text || "GGWP";
      document.getElementById("cluePopup").classList.add("show");
    }
  }
}

// Sessione già aperta?
(async () => {
  const { data } = await sb.auth.getSession();
  if (data.session) {
    token = data.session.access_token;
    showHome(data.session.user.email);
  } else {
    showLogin();
  }
  sb.auth.onAuthStateChange((_event, session) => {
    if (session) {
      token = session.access_token;
    } else {
      token = null;
      showLogin();
    }
  });
})();
</script>
