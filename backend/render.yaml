# Metti QUESTO file nella ROOT del repo GitHub (accanto a backend/ e docs/),
# non dentro backend/.
services:
  - type: web
    name: penumbra-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
